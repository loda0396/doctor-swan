name: doctor-swan

on:
  schedule:
    # UTC。GitHub 的定时不保证准点，高峰期会延迟几分钟到半小时，能接受。
    - cron: '0,30 * * * *'
  workflow_dispatch:        # 也可以在网页上手动点一次

permissions:
  contents: write           # 需要写权限，因为要把数据库和页面提交回来

concurrency:
  group: watch              # 上一轮没跑完就不开下一轮，避免两个进程同时写库
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet feedparser beautifulsoup4

      - name: 采集 · 生成
        working-directory: app
        run: |
          # 加 || true：某个源挂掉不该让整轮失败。
          # 单源的失败在日志里看得到，但页面该照常出。
          python collect.py run --no-x || true
          python build.py --hours 3
          # enrich.py（调模型做翻译和地区标注）2026-10 从流程里摘掉了。
          # 它从 9 月 17 日起就一直静默失败，积压了两千多条没分类的条目——
          # || true 让它失败也不中断，所以这事半个月没人发现。
          # 现在标题显示原文，地区改由 regions.py 的关键词规则在渲染时算，
          # 不需要 API key，也不需要回填：旧条目下次生成就有颜色。

      - name: 发布
        run: |
          cp app/dashboard.html index.html
          git config user.name  "doctor-swan"
          git config user.email "actions@github.com"
          git add index.html app/watch.db
          # 没变化时 commit 会失败，用 || true 让整个 job 仍然算成功
          git diff --staged --quiet || git commit -m "update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
